[pytest]
# -ra prints the reason for every skipped test. Every KLayout suite here is
# guarded on a `klayout` binary being on PATH, and the pip wheel ships the
# Python module without the CLI, so `pip install klayout pytest` produces a
# green run that skipped the PCell, LVS and cmim tests. The ngspice and xschem
# suites are gated the same way. A reason per skip is what makes that visible
# instead of arithmetic on a passed count.
#
# --strict-markers and --strict-config turn a typo in a marker or an ini key
# into an error instead of a silently ignored line.
addopts = -ra --strict-markers --strict-config
testpaths = libs.tech/klayout/intm4tm2_tests
